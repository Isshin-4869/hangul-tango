<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0EA">
<title>ハングル単語帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語帳">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app. Fixed bottom tabs; study modes open as a full-screen sheet.
   Cards borrow the 원고지 (manuscript-grid) paper of a Korean notebook. */
:root{
  --bg:#EEF0EA; --surface:#FAFBF7; --sunk:#E2E6DD; --ink:#1A2230; --muted:#5E675F; --line:#D2D7CC;
  --accent:#2B47A8; --accent-ink:#FFFFFF; --accent-soft:#DCE2F4;
  --again:#B5392A; --hard:#9A630F; --good:#2B6B4F; --easy:#2B47A8;
  --grid:rgba(43,71,168,.075);
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-ko:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --f-kos:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --tab-h:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1A1E24; --sunk:#242930; --ink:#E5E8E2; --muted:#99A19B; --line:#2F353D;
  --accent:#8FA5EE; --accent-ink:#0D1325; --accent-soft:#252E4B;
  --again:#E27665; --hard:#D8A64E; --good:#6CBF98; --easy:#8FA5EE; --grid:rgba(143,165,238,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1A1E24; --sunk:#242930; --ink:#E5E8E2; --muted:#99A19B; --line:#2F353D;
  --accent:#8FA5EE; --accent-ink:#0D1325; --accent-soft:#252E4B;
  --again:#E27665; --hard:#D8A64E; --good:#6CBF98; --easy:#8FA5EE; --grid:rgba(143,165,238,.07); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.ko{font-family:var(--f-kos)}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.view{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-top:20px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* type */
h2{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.eyebrow{font-size:13px;color:var(--muted);margin:0}
.sub{font-size:13px;color:var(--muted)}

/* today */
.today{display:flex;flex-direction:column;gap:16px}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.today-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
.counts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.counts>div{padding:12px 0 10px;display:flex;flex-direction:column}
.counts>div+div{padding-left:14px;border-left:1px solid var(--line)}
.counts b{font-size:32px;line-height:1.1;font-weight:500;font-variant-numeric:tabular-nums}
.counts span{font-size:12px;color:var(--muted)}
.counts .c-rev b{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;font-weight:700;font-size:16px}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-p:disabled{background:var(--sunk);color:var(--muted);cursor:default}
.btn-s{background:var(--sunk)}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-block{width:100%}
.btn-sm{min-height:36px;font-size:14px;padding:0 12px;border-radius:8px}

/* forecast */
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.fc-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.fc-bar{width:100%;max-width:30px;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px}
.fc-col.today .fc-bar{background:var(--accent)}
.fc-n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fc-d{font-size:11px;color:var(--muted)}
.fc-col.today .fc-d{color:var(--ink);font-weight:700}

/* progress */
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* range chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.chip{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.range-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.sw{width:42px;height:26px;border-radius:13px;background:var(--sunk);position:relative;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
[aria-checked="true"] .sw{background:var(--accent)}
[aria-checked="true"] .sw::after{transform:translateX(16px)}

/* mode list */
.modes{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mode{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.mode-ic{width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-ko);font-size:20px;font-weight:700;color:var(--accent)}
.mode b{display:block;font-size:16px}
.mode small{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.mode svg{width:18px;height:18px;color:var(--muted)}

/* list */
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0 10px;display:flex;flex-direction:column;gap:8px;margin-top:-20px}
.search input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:14px}
.fbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.row-main{min-width:0;text-align:left;display:flex;flex-direction:column}
.row-ko{font-family:var(--f-kos);font-size:18px;line-height:1.3}
.row-ja{font-size:13px;color:var(--muted);line-height:1.4}
.row-side{display:flex;align-items:center;gap:6px}
.st{font-size:11px;padding:2px 7px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.st-new{background:var(--sunk);color:var(--muted)}
.st-lrn{background:color-mix(in srgb,var(--hard) 18%,transparent);color:var(--hard)}
.st-rev{background:var(--accent-soft);color:var(--accent)}
.st-mst{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.star{width:36px;height:36px;display:grid;place-items:center;color:var(--line)}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:#D4A017}
.row-detail{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:4px}
.more{padding:16px 0;text-align:center}

/* settings */
.set-group{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row>div:first-child{min-width:0;flex:1 1 180px}
.set-row small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 11px;border-radius:7px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
textarea.backup{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.note{font-size:13px;color:var(--muted);line-height:1.7}
.note ol{margin:6px 0 0;padding-left:1.3em}
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
.tip p{margin:0;flex:1}

/* study sheet */
#study{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.s-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:6px 8px 0;max-width:600px;width:100%;margin:0 auto}
.s-title{text-align:center;font-size:14px;font-weight:700}
.s-title small{display:block;font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.3}
.s-prog{height:3px;background:var(--sunk);margin:6px 16px 0;border-radius:2px;overflow:hidden;max-width:568px;align-self:center;width:calc(100% - 32px)}
.s-prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.s-body{flex:1;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto}

/* card */
.card{position:relative;background-color:var(--surface);border:1px solid var(--line);border-radius:14px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px}
.card-meta{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-tools{position:absolute;top:4px;right:4px;display:flex}
.card-tools .star[aria-pressed="false"]{color:var(--muted);opacity:.5}
.big-ko{font-family:var(--f-ko);font-size:clamp(32px,10vw,46px);line-height:1.3;font-weight:700;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.big-ja{font-size:clamp(20px,6vw,26px);line-height:1.5;font-weight:500;text-align:center;overflow-wrap:anywhere}
.small-ko{font-family:var(--f-kos);font-size:17px;color:var(--muted);text-align:center}

/* review */
.rv-card{flex:1;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:52px 20px 28px;cursor:pointer}
.rv-ans{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding-top:16px;border-top:1px solid var(--line);animation:rise .18s ease-out}
.rv-ans .pos{font-size:12px;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rv-foot{padding-top:14px;display:flex;flex-direction:column;gap:8px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate{min-height:62px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.rate b{font-size:15px}
.rate span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rate.r1 b{color:var(--again)} .rate.r2 b{color:var(--hard)} .rate.r3 b{color:var(--good)} .rate.r4 b{color:var(--easy)}
.rate:active{background:var(--sunk)}
.kbd-hint{font-size:11px;color:var(--muted);text-align:center}
@media (hover:none){.kbd-hint{display:none}}

/* flashcards */
.fl-wrap{flex:1;min-height:320px;perspective:1200px;position:relative;touch-action:pan-y}
.fl{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.fl.flipped{transform:rotateY(180deg)}
.fl .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:52px 20px 28px}
.fl .back{transform:rotateY(180deg)}
.fl-drag{position:absolute;inset:0;will-change:transform}
.fl-stamp{position:absolute;top:18px;font-size:14px;font-weight:700;padding:4px 10px;border-radius:6px;border:2px solid currentColor;opacity:0;pointer-events:none;z-index:3}
.fl-stamp.l{left:18px;color:var(--hard);transform:rotate(-8deg)}
.fl-stamp.r{right:18px;color:var(--good);transform:rotate(8deg)}
.fl-foot{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding-top:14px}
.fl-foot .btn{min-height:52px}
.b-still{border:1.5px solid var(--hard);color:var(--hard);background:var(--surface)}
.b-know{border:1.5px solid var(--good);color:var(--good);background:var(--surface)}
.tally{display:flex;justify-content:space-between;font-size:13px;padding-bottom:10px;font-variant-numeric:tabular-nums}
.tally .l{color:var(--hard)} .tally .r{color:var(--good)}

/* questions */
.q{display:flex;flex-direction:column;gap:14px}
.q-prompt{padding:44px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:8px}
.q-label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:520px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:54px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;align-items:center;gap:12px;line-height:1.4}
.opt .n{width:22px;height:22px;flex:none;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.opt.ko-opt{font-family:var(--f-kos);font-size:18px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.ng{border-color:var(--again);background:color-mix(in srgb,var(--again) 10%,var(--surface))}
.opt:disabled{cursor:default}
.wr{display:flex;gap:8px}
.wr input{flex:1;min-width:0;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-family:var(--f-kos);font-size:20px}
.wr input.ok{border-color:var(--good)} .wr input.ng{border-color:var(--again)}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.fb.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.fb.ng{background:color-mix(in srgb,var(--again) 10%,transparent)}
.fb.ng .t{color:var(--again);font-weight:700}
.fb .ans{font-family:var(--f-kos);font-size:20px;color:var(--ink)}
.fb-acts{display:flex;gap:8px;flex-wrap:wrap}
.link{color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* round / results */
.res{display:flex;flex-direction:column;gap:22px;padding-top:8px}
.res h3{font-size:22px;margin:0}
.res-score{display:flex;align-items:baseline;gap:8px}
.res-score b{font-size:56px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.res-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.res-item{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.res-item .mk{font-weight:700;font-size:15px;line-height:1.5}
.mk.ok{color:var(--good)} .mk.ng{color:var(--again)}
.res-item .ko{font-size:17px}
.res-item small{display:block;color:var(--muted);font-size:13px}
.res-item .yours{color:var(--again)}
.res-acts{display:flex;flex-direction:column;gap:8px}

/* setup */
.setup{display:flex;flex-direction:column;gap:20px}
.setup h3{margin:0;font-size:20px}
.setup p{margin:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.check[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}

/* test sheet */
.tq{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}
.tq-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tq-p{font-size:20px;font-weight:500}
.tq-p.ko{font-family:var(--f-ko);font-weight:700;font-size:26px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf-pair{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tf-pair .ko{font-size:20px}

/* match */
.mt-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px}
.mt-time{font-size:28px;font-variant-numeric:tabular-nums;font-weight:500}
.mt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;max-height:560px}
.tile{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px;display:grid;place-items:center;text-align:center;font-size:14px;line-height:1.35;min-height:76px;overflow-wrap:anywhere;transition:opacity .25s,transform .25s}
.tile.ko{font-family:var(--f-kos);font-size:19px}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.bad{border-color:var(--again);animation:shake .3s}
.tile.gone{opacity:0;transform:scale(.92);pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:24px 0}
.empty h3{margin:0;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <main id="main">
    <section class="view" id="v-home" aria-label="今日"></section>
    <section class="view" id="v-list" aria-label="単語" hidden></section>
    <section class="view" id="v-set" aria-label="設定" hidden></section>

/* ---------- distractors ---------- */
function options(w, field, n = 4) {
  const used = new Set([w[field]]), out = [w];
  const pl = pool();
  const tiers = [pl.filter(x => x.pos0 === w.pos0), pl, W.filter(x => x.pos0 === w.pos0), W];
  for (const t of tiers) {
    for (const x of shuffle(t)) {
      if (out.length >= n) break;
      if (used.has(x[field]) || x.k === w.k || x.j === w.j) continue;
      used.add(x[field]); out.push(x);
    }
    if (out.length >= n) break;
  }
  return shuffle(out);
}

/* ---------- 1. SRS review ---------- */
function startReview() {
  const now = Date.now();
  const rev = shuffle(W.filter(w => { const c = cardOf(w); return c && c.s === 2 && c.due <= now; }));
  const lrn = W.filter(w => { const c = cardOf(w); return c && (c.s === 1 || c.s === 3); }).sort((a, b) => cardOf(a).due - cardOf(b).due);
  const news = newQueue();
  const main = []; let ni = 0;
  rev.forEach((w, i) => { main.push(w); if (i % 3 === 2 && ni < news.length) main.push(news[ni++]); });
  while (ni < news.length) main.push(news[ni++]);
  S = { kind: "review", main, lrn, cur: null, dir: "ko", shown: false, done: 0, hist: [], total: main.length + lrn.filter(w => cardOf(w).due <= now + 20 * MIN).length };
  openSheet("復習", "");
  nextReview();
}
function reviewLeft() { return S.main.length + S.lrn.length + (S.cur ? 1 : 0); }
function nextReview() {
  const now = Date.now();
  S.lrn.sort((a, b) => cardOf(a).due - cardOf(b).due);
  let w = null;
  if (S.lrn.length && cardOf(S.lrn[0]).due <= now) w = S.lrn.shift();
  else if (S.main.length) w = S.main.shift();
  else if (S.lrn.length && cardOf(S.lrn[0]).due <= now + 20 * MIN) w = S.lrn.shift();
  S.cur = w; S.shown = false; S.dir = pickDir();
  const undo = h("button", { class: "icon-btn", "aria-label": "1つ前に戻す", html: ICON.undo, disabled: !S.hist.length, onclick: undoReview });
  setAux(undo);
  if (!w) return reviewDone();
  const c = cardOf(w);
  const tag = !c || c.s === 0 ? "新しい単語" : c.s === 2 ? "復習" : "学習中";
  setTitle("復習", `残り ${reviewLeft()} ・ ${tag}`);
  setProg(S.done / Math.max(1, S.done + reviewLeft()));
  drawReview();

  const qs = S.qs; setTitle("テスト", `${qs.length}問`); keyHandler = null;
  const answered = () => qs.filter(q => q.t === "wr" ? q.a.trim() : q.a !== null).length;
  const upd = () => { setProg(answered() / qs.length); submit.textContent = `採点する（${answered()} / ${qs.length}）`; };
  const list = h("div");
  qs.forEach((q, i) => {
    const head = h("div", { class: "tq-h num" }, h("span", null, `${i + 1} / ${qs.length}`), h("span", null, { mc: "4択", tf: "○×", wr: "記述" }[q.t]));
    let el;
    if (q.t === "mc") {
      const field = q.dir === "ko" ? "j" : "k";
      const opts = h("div", { class: "opts" });
      q.os.forEach((x, j) => { const b = h("button", { class: "opt" + (field === "k" ? " ko-opt" : ""), "aria-pressed": "false" }, h("span", { class: "n" }, j + 1), x[field]);
        b.addEventListener("click", () => { q.a = x; opts.querySelectorAll(".opt").forEach(o => { o.style.borderColor = ""; o.style.background = ""; }); b.style.borderColor = "var(--accent)"; b.style.background = "var(--accent-soft)"; upd(); }); opts.append(b); });
      el = h("div", { class: "tq" }, head, h("div", { class: "tq-p" + (q.dir === "ko" ? " ko" : "") }, q.dir === "ko" ? q.w.k : q.w.j), opts);
    } else if (q.t === "tf") {
      const tf = h("div", { class: "tf" });
      [["○ 正しい", true], ["× ちがう", false]].forEach(([t, v]) => { const b = h("button", { class: "opt", style: "justify-content:center" }, t);
        b.addEventListener("click", () => { q.a = v; tf.querySelectorAll(".opt").forEach(o => { o.style.borderColor = ""; o.style.background = ""; }); b.style.borderColor = "var(--accent)"; b.style.background = "var(--accent-soft)"; upd(); }); tf.append(b); });
      el = h("div", { class: "tq" }, head, h("div", { class: "tf-pair" }, h("span", { class: "ko" }, q.w.k), h("span", null, q.other.j)), tf);
    } else {
      const inp = h("input", { type: "text", lang: "ko", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "韓国語で入力", "aria-label": `${i + 1}問目の答え` });
      inp.addEventListener("input", () => { q.a = inp.value; upd(); });
      el = h("div", { class: "tq" }, head, h("div", { class: "tq-p" }, q.w.j), h("div", { class: "wr" }, inp));
    }
    list.append(el);
  });
  const submit = h("button", { class: "btn btn-p btn-block", style: "margin-top:20px", onclick: gradeTest }, "");
  body().replaceChildren(list, submit); upd(); body().scrollTop = 0;
}
function gradeTest() {
  const qs = S.qs; let score = 0;
  qs.forEach(q => {
    if (q.t === "mc") q.ok = !!q.a && q.a.k === q.w.k;
    else if (q.t === "tf") q.ok = q.a !== null && q.a === q.truth;
    else q.ok = !!normKo(q.a) && koAlts(q.w.k).includes(normKo(q.a));
    if (q.ok) score++;
  });
  logActivity(qs.length); save();
  const wrong = qs.filter(q => !q.ok).map(q => q.w);
  const pct = Math.round(score / qs.length * 100);
  setProg(1); setTitle("テスト", "結果");
  const yourAns = q => q.t === "mc" ? (q.a ? (q.dir === "ko" ? q.a.j : q.a.k) : "未回答") : q.t === "tf" ? (q.a === null ? "未回答" : q.a ? "○" : "×") + `（${q.other.j}）` : (q.a.trim() || "未回答");
  body().replaceChildren(h("div", { class: "res" },
    h("div", { class: "res-score" }, h("b", null, pct), h("span", { class: "sub" }, `点 ・ ${score} / ${qs.length}問正解`)),
    h("div", { class: "res-acts" },
      wrong.length ? h("button", { class: "btn btn-line", onclick: () => { wrong.forEach(w => toggleStar(w, true)); toast(`${wrong.length}語に★を付けました`); } }, "間違えた単語に★を付ける") : null,
      h("button", { class: "btn btn-p", onclick: startTest }, "もう一度テスト")),
    h("div", null, h("h2", null, "答え合わせ"), h("div", { class: "res-list" }, qs.map(q => h("div", { class: "res-item" },
      h("span", { class: "mk " + (q.ok ? "ok" : "ng") }, q.ok ? "○" : "×"),
      h("div", null, h("span", { class: "ko" }, q.w.k), h("small", null, q.w.j), !q.ok ? h("small", { class: "yours" }, "あなたの答え：" + yourAns(q)) : null))))),
    h("button", { class: "btn btn-s", onclick: closeSheet }, "閉じる")));
  body().scrollTop = 0;
}

/* ---------- 5. Match ---------- */
function startMatch() {
  const pl = pool();
  openSheet("マッチ", "");
  if (pl.length < 3) return emptyState("単語が足りません", "出題範囲を広げてください。");
  // avoid identical meanings in one board
  const seenJ = new Set(), pick = [];
  for (const w of shuffle(pl)) { if (seenJ.has(w.j)) continue; seenJ.add(w.j); pick.push(w); if (pick.length === 6) break; }
  const tiles = shuffle(pick.flatMap(w => [{ w, side: "k" }, { w, side: "j" }]));
  const key = "match:" + (P.prefs.lessons.join(",") || "all") + (P.prefs.starOnly ? "*" : "");
  S = { kind: "match", tiles, sel: null, left: pick.length, t0: performance.now(), pen: 0, raf: 0, key, onClose: () => cancelAnimationFrame(S.raf) };
  const time = h("span", { class: "mt-time", id: "mt-time" }, "0.0");
  const best = P.best[key];
  const grid = h("div", { class: "mt-grid" });
  tiles.forEach(t => {
    const b = h("button", { class: "tile" + (t.side === "k" ? " ko" : "") }, t.w[t.side]);
    t.el = b;
    b.addEventListener("click", () => tapTile(t));
    grid.append(b);
  });
  setTitle("マッチ", "同じ意味の2枚をタップ");
  body().replaceChildren(h("div", { class: "mt-head" }, time, h("span", { class: "sub num" }, best ? `ベスト ${best.toFixed(1)}秒` : "ミスは+1秒")), grid);
  const tick = () => { if (!S || S.kind !== "match") return; $("#mt-time").textContent = ((performance.now() - S.t0) / 1000 + S.pen).toFixed(1); S.raf = requestAnimationFrame(tick); };
  tick();
}
function tapTile(t) {
  if (t.el.classList.contains("gone")) return;
  if (!S.sel) { S.sel = t; t.el.classList.add("sel"); if (t.side === "k" && P.prefs.tts) speak(t.w.k); return; }
  if (S.sel === t) { t.el.classList.remove("sel"); S.sel = null; return; }
  const a = S.sel; S.sel = null; a.el.classList.remove("sel");
  if (a.w.k === t.w.k && a.side !== t.side) {
    a.el.classList.add("gone"); t.el.classList.add("gone"); S.left--; logActivity();
    if (!S.left) matchDone();
  } else {
    S.pen += 1;
    [a, t].forEach(x => { x.el.classList.remove("bad"); void x.el.offsetWidth; x.el.classList.add("bad"); setTimeout(() => x.el.classList.remove("bad"), 320); });
  }
}
function matchDone() {
  cancelAnimationFrame(S.raf);
  const sec = Math.round(((performance.now() - S.t0) / 1000 + S.pen) * 10) / 10;
  const prev = P.best[S.key], isBest = !prev || sec < prev;
  if (isBest) P.best[S.key] = sec;
  save(); setProg(1);
  body().replaceChildren(h("div", { class: "res" },
    h("h3", null, isBest && prev ? "ベスト更新" : "そろいました"),
    h("div", { class: "res-score" }, h("b", null, sec.toFixed(1)), h("span", { class: "sub" }, "秒" + (S.pen ? `（ミス ${S.pen}回を含む）` : ""))),
    prev && !isBest ? h("p", { class: "sub", style: "margin:0" }, `ベストは ${prev.toFixed(1)} 秒`) : null,
    h("div", { class: "res-list" }, S.tiles.filter(t => t.side === "k").map(t => h("div", { class: "res-item" }, h("span", { class: "mk ok" }, "○"), h("div", null, h("span", { class: "ko" }, t.w.k), h("small", null, t.w.j))))),
    h("div", { class: "res-acts" }, h("button", { class: "btn btn-p", onclick: startMatch }, "もう一度"), h("button", { class: "btn btn-s", onclick: closeSheet }, "閉じる"))));
}

/* ---------- boot ---------- */
loadLocal();
showTab("home");
cloudInit();
setInterval(() => { if ($("#study").hidden && tab === "home") renderHome(); }, 60e3);
</script>
